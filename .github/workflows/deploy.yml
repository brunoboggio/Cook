name: 🚀 Deploy Cook to BanaHosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: 📦 Sync to cook.liberatueco.com
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🚀 FTP Deploy to BanaHosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: cook.liberatueco.com/
          protocol: ftp
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github*
            **/.github*/**
            **/README.md
