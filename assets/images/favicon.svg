<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Emerald Flow Gradient -->
    <linearGradient id="emeraldFlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="40%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Accent Cyan Glow -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Amber Spark Gradient -->
    <linearGradient id="amberSpark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Ambient Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#10B981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Border -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bgGrad)" stroke="rgba(16, 185, 129, 0.45)" stroke-width="8" filter="url(#dropShadow)"/>

  <!-- Subtle Inner Ambient Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="3" stroke-dasharray="8 8"/>

  <!-- Central Dynamic Symbol: The Gourmet Fridge Flow Cloche & Sprout -->
  <g transform="translate(0, 10)" filter="url(#glowEffect)">
    <!-- Base Plate / Flow Tray -->
    <path d="M 136 340 C 136 332, 144 326, 154 326 L 358 326 C 368 326, 376 332, 376 340 C 376 348, 368 354, 358 354 L 154 354 C 144 354, 136 348, 136 340 Z" fill="url(#cyanGlow)" opacity="0.95"/>
    
    <!-- Base Rim Highlight -->
    <path d="M 116 354 C 116 348, 124 344, 134 344 L 378 344 C 388 344, 396 348, 396 354 C 396 360, 388 364, 378 364 L 134 364 C 124 364, 116 360, 116 354 Z" fill="rgba(255,255,255,0.25)"/>

    <!-- The Cloche Dome / Flow Arc -->
    <path d="M 148 316 C 152 216, 206 168, 256 168 C 306 168, 360 216, 364 316 Z" fill="url(#emeraldFlow)"/>

    <!-- Inner Gourmet Cutout Curve (Dynamic Flow) -->
    <path d="M 206 316 C 208 256, 236 222, 256 222 C 276 222, 304 256, 306 316 Z" fill="#090D16" opacity="0.96"/>

    <!-- Cloche Top Handle / Nutrition Seed -->
    <circle cx="256" cy="150" r="22" fill="url(#amberSpark)"/>
    
    <!-- AI Sparkle Star on Top Right -->
    <path d="M 370 115 Q 370 140, 395 140 Q 370 140, 370 165 Q 370 140, 345 140 Q 370 140, 370 115 Z" fill="url(#amberSpark)"/>
    <circle cx="330" cy="110" r="5" fill="#34D399"/>
    <circle cx="410" cy="175" r="4" fill="#38BDF8"/>
  </g>
</svg>