<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="100%" height="100%">
  <defs>
    <linearGradient id="logoEmerald" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="40%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="logoCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="logoAmber" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Emblem on Left -->
  <g transform="translate(15, 15) scale(0.29)" filter="url(#logoGlow)">
    <rect x="24" y="24" width="464" height="464" rx="128" fill="#090D16" stroke="rgba(16, 185, 129, 0.45)" stroke-width="8"/>
    <path d="M 136 340 C 136 332, 144 326, 154 326 L 358 326 C 368 326, 376 332, 376 340 C 376 348, 368 354, 358 354 L 154 354 C 144 354, 136 348, 136 340 Z" fill="url(#logoCyan)"/>
    <path d="M 148 316 C 152 216, 206 168, 256 168 C 306 168, 360 216, 364 316 Z" fill="url(#logoEmerald)"/>
    <path d="M 206 316 C 208 256, 236 222, 256 222 C 276 222, 304 256, 306 316 Z" fill="#090D16"/>
    <circle cx="256" cy="150" r="22" fill="url(#logoAmber)"/>
    <path d="M 370 115 Q 370 140, 395 140 Q 370 140, 370 165 Q 370 140, 345 140 Q 370 140, 370 115 Z" fill="url(#logoAmber)"/>
  </g>

  <!-- Typography on Right -->
  <text x="180" y="105" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="70" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
    Fridge<tspan fill="url(#logoEmerald)">Flow</tspan>
  </text>
  <text x="184" y="142" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#94A3B8" letter-spacing="3.5">
    PLANIFICADOR &amp; RECETAS IA
  </text>
</svg>